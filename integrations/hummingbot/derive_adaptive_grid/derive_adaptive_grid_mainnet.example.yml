# MAINNET CANARY READINESS TEMPLATE — disabled by design.
#
# This is a separate file from the testnet configuration.  It is not an
# approval to trade.  Leave all gates below disabled until the read-only audit,
# authenticated account check, and human review are complete.
id: derive_adaptive_grid_mainnet_canary
controller_name: derive_adaptive_grid
controller_type: market_making

connector_name: derive_perpetual
trading_pair: BTC-USDC
environment: mainnet
market_environment: mainnet
options_environment: production
account_environment: mainnet
execution_environment: mainnet
leverage: 1
position_mode: ONEWAY
allow_mainnet_trading: false

# Keep this dry-run posture.  The controller refuses new mainnet entries until
# all three switches plus mainnet_canary_ack are explicitly supplied.
execution_enabled: false
execution_max_levels_per_side: 1
testnet_order_scale: null
mainnet_canary_order_scale: null
post_only: true

# These are deliberately unset.  Populate only from the live read-only audit;
# there are no invented defaults and the smallest valid order must fit them.
mainnet_canary_max_order_notional: null
mainnet_canary_max_total_position_notional: null
mainnet_canary_max_loss_quote: null
mainnet_environment_verified: false
mainnet_account_state_verified: false
mainnet_canary_ack: null

# Mainnet paths must not share testnet plans, journals, or rotated files.
grid_plan_path: /home/hummingbot/data/derive_mainnet_grid_plans.jsonl
execution_journal_path: /home/hummingbot/data/derive_mainnet_execution_events.jsonl
replay_existing_plan: true

# Keep the one-level rollout and small executor caps.
max_total_position_notional: null
max_side_position_notional: null
max_active_grid_levels: 2
max_active_executors: 2
minimum_order_lifetime_seconds: 30
maximum_order_lifetime_seconds: 600
refresh_price_tolerance_bps: 5
refresh_amount_tolerance_pct: 0.05
max_consecutive_order_errors: 3
order_error_pause_seconds: 60
stale_plan_timeout_seconds: 30
collateral_safety_buffer_pct: 0.10
cancel_orders_on_pause: true
cancel_orders_on_shutdown: true
manual_kill_switch: false
emergency_close_positions_on_pause: false

# Native PositionExecutor exits remain maker-only.  Do not force a taker exit
# during this readiness stage; set a loss limit only after the account/risk
# review has established the canary budget.
take_profit_mode: adjacent_grid
take_profit_pct: 0.001
take_profit_step_multiplier: 1
stop_loss_pct: null
time_limit_seconds: null
