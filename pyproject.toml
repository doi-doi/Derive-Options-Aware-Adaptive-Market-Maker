[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "derive-options-aware-adaptive-market-maker"
version = "0.1.0"
description = "Evidence-first research for an options-aware Derive perpetual market maker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "doi-doi"}]
dependencies = [
  "pydantic>=2.0,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
dashboard = [
  "streamlit>=1.40",
]

[project.scripts]
derive-phase1-audit = "derive_options_mm.phase1_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
